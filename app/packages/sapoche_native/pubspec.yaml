name: sapoche_native
description: "The iOS native side of Sapoche: player, room connection, YouTube access and the library. Android has its own in app/android."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.13.4
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SapocheNativePlugin
