# Builds the Flutter app for iOS on a macOS runner and publishes an unsigned IPA as a build artifact; a tag `v<version>` also
# puts it on a release of this repository, with a SideStore source, so an iPhone can be told a new version is out.
# The IPA is signed on the phone by SideStore with the owner's own Apple ID; nothing secret lives here.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'
    tags: ['v*']

jobs:
  # The native side of iOS is Swift; its portable part (everything but the player and the system's own services) is
  # compiled and tested here on Linux, where it is quick, before the macOS job builds the whole app.
  swift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.3-noble
    defaults:
      run:
        working-directory: app/packages/sapoche_native
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev
      - run: swift test

  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: Build the app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --split-debug-info=build/symbols --obfuscate 2>&1 | tee build.log

      # The log of a run is only readable when signed in to GitHub; the compiler's complaints are also put where
      # anybody can read them, in the annotation of the run.
      - name: Say what the compiler complained about
        if: failure()
        run: |
          messages=$(grep -E "error:|Error:|error " build.log | sort -u | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${messages}"

      - name: Package the unsigned IPA
        run: |
          rm -rf Payload sapoche-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry sapoche-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: sapoche-ios-unsigned
          path: app/sapoche-unsigned.ipa
          retention-days: 14

      # A stack trace from this build is read again with `flutter symbolize -d <this folder>`
      - uses: actions/upload-artifact@v4
        with:
          name: sapoche-ios-symbols
          path: app/build/symbols
          retention-days: 90

  # A tag `v1.33.0` makes a release of this repository: the IPA, and `source.json`, a source that SideStore can be given
  # (https://github.com/<owner>/<repo>/releases/latest/download/source.json) to list and update Sapoche. The notes are
  # app/release-notes/<version>.txt. The app asks for the latest release to know a newer version is out.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ipa
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sapoche-ios-unsigned
      - name: Make the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          build=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/.*+//')
          mv sapoche-unsigned.ipa "sapoche-${version}.ipa"
          size=$(stat -c %s "sapoche-${version}.ipa")
          repo="${GITHUB_REPOSITORY}"
          cp "app/release-notes/${version}.txt" notes.txt
          python3 - "$version" "$build" "$size" "$repo" <<'PY'
          import json, sys, datetime
          version, build, size, repo = sys.argv[1:5]
          notes = open("notes.txt").read().strip()
          app = {
              "name": "Sapoche",
              "bundleIdentifier": "app.sapoche.sapoche",
              "developerName": "tranviethungpv",
              "subtitle": "Listen to YouTube music together",
              "localizedDescription": "Listen to YouTube music together, in step, in a Room; and on your own, like any music app.",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/app/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png",
              "tintColor": "D81B60",
              "versions": [{
                  "version": version,
                  "buildVersion": build,
                  "date": datetime.date.today().isoformat(),
                  "localizedDescription": notes,
                  "downloadURL": f"https://github.com/{repo}/releases/download/v{version}/sapoche-{version}.ipa",
                  "size": int(size),
                  "minOSVersion": "15.0",
              }],
          }
          # The first form of an AltStore source keeps the newest version beside the app, and is still read
          app.update({"version": version, "versionDate": app["versions"][0]["date"], "versionDescription": notes,
                      "downloadURL": app["versions"][0]["downloadURL"], "size": int(size)})
          source = {"name": "Sapoche", "identifier": "app.sapoche.source", "apps": [app], "news": []}
          json.dump(source, open("source.json", "w"), indent=2, ensure_ascii=False)
          PY
          # The Android build is put on the same release from the owner's computer (app/tool/release.sh), before or after this
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "Sapoche ${version}" --notes-file notes.txt --verify-tag || gh release view "${TAG}" >/dev/null
          gh release upload "${TAG}" "sapoche-${version}.ipa" source.json --clobber
