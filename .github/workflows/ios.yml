# Builds the Flutter app for iOS on a macOS runner and publishes an unsigned IPA as a build artifact.
# The IPA is signed on the phone by SideStore with the owner's own Apple ID; nothing secret lives here.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'

jobs:
  # The native side of iOS is Swift; its portable part (everything but the player and the system's own services) is
  # compiled and tested here on Linux, where it is quick, before the macOS job builds the whole app.
  swift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.3-noble
    defaults:
      run:
        working-directory: app/packages/unison_native
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev
      - run: swift test

  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: Build the app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      # The log of a run is only readable when signed in to GitHub; the compiler's complaints are also put where
      # anybody can read them, in the annotation of the run.
      - name: Say what the compiler complained about
        if: failure()
        run: |
          messages=$(grep -E "error:|Error:|error " build.log | sort -u | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${messages}"

      - name: Package the unsigned IPA
        run: |
          rm -rf Payload unison-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry unison-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: unison-ios-unsigned
          path: app/unison-unsigned.ipa
          retention-days: 14
